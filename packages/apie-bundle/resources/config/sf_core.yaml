services:
  Apie\Core\Session\SessionFactoryInterface:
    class: Apie\ApieBundle\Session\SymfonySessionFactory
    arguments:
      - '@request_stack'
      - '@kernel'

  Apie\Common\ContextBuilders\FrameworkContextBuilder:
    arguments:
      - 'symfony'
    tags: ['apie.core.context_builder']
  Apie\Core\Session\CsrfTokenProvider:
    alias: Apie\ApieBundle\ContextBuilders\CsrfTokenContextBuilder
