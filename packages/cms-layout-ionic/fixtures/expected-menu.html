<script>
    (async function (group) {
        group.addEventListener('ionChange', (event) => {
            if (event.target !== group) {
                return;
            }
            const open = event.detail.value;
            if (open !== undefined) {
                localStorage.setItem(
                        "accordion.menu_header",
                    JSON.stringify(open)
                );
            } else {
                localStorage.removeItem("accordion.menu_header");
            }
        });
        await customElements.whenDefined('ion-accordion-group');
        const saved = localStorage.getItem("accordion.menu_header");

        if (saved && saved !== 'undefined') {
            group.value = JSON.parse(saved);
        }
    }(document.querySelector("ion-accordion-group#group_menu_header")))
</script>
